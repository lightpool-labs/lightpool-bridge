[package]
name = "lightpool-bridge"
version = "0.2.0"
edition = "2021"
authors = ["LightPool Team"]
description = "Off-chain LightPool bridge process: watch EVM, collect signatures, submit confirmations"
publish = false

[[bin]]
name = "lightpool-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.5.0", features = ["rt", "net", "sync", "macros", "time", "rt-multi-thread", "signal", "process"] }
tokio-util = { version = "0.7.3", features = ["codec"] }
log = "0.4.14"
env_logger = "0.9.0"
clap = { version = "4.4.11", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.61"
thiserror = "1.0.21"
anyhow = "1.0.38"
bincode = "1.3.3"
hex = "0.4.3"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.13.0"
ethabi = "18"
ethereum-types = "0.14"
k256 = { version = "0.13", features = ["ecdsa"] }

lightpool-crypto = { path = "../lightpool-crypto" }
lightpool-types = { path = "../lightpool/crates/lightpool-types" }

[patch."https://github.com/xiaoyu1998/lightpool-crypto.git"]
lightpool-crypto = { path = "../lightpool-crypto" }
