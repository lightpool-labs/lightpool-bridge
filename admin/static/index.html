<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LightPool Bridge</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f0f9ff;
      --panel: #ffffff;
      --border: #e0f2fe;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --label: #334155;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-soft: #e0f2fe;
      --accent-text: #0369a1;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --danger-border: #fecaca;
      --ok: #059669;
      --ok-soft: #ecfdf5;
      --ok-border: #a7f3d0;
      --warn: #b45309;
      --sidebar-w: 260px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    .header-title {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--accent-text);
      letter-spacing: -0.01em;
    }
    .layout { display: flex; flex: 1; min-height: 0; }
    .sidebar {
      width: var(--sidebar-w);
      border-right: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .route-tree { list-style: none; margin: 0; padding: 0.5rem 0; overflow-y: auto; flex: 1; }
    .tree-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.75rem 0.5rem 1rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      font-size: 0.875rem;
      color: #475569;
    }
    .tree-item:hover { background: #f8fafc; color: var(--accent-text); }
    .tree-item.active {
      background: var(--accent-soft);
      border-left-color: #0ea5e9;
      color: var(--accent-text);
      font-weight: 500;
    }
    .tree-item.root { font-weight: 600; }
    .tree-item.child { padding-left: 1.75rem; }
    .tree-item .icon { color: var(--muted); font-size: 0.75rem; width: 1rem; text-align: center; flex-shrink: 0; }
    .tree-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-item code { font-size: 0.8125rem; color: inherit; }
    .tree-actions {
      display: none;
      align-items: center;
      gap: 0.15rem;
      margin-left: auto;
      flex-shrink: 0;
    }
    .tree-item.child:hover .tree-actions { display: flex; }
    .tree-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      border: none;
      border-radius: 0.375rem;
      background: transparent;
      color: var(--muted);
    }
    .tree-action:hover:not(:disabled) {
      background: #e2e8f0;
      color: var(--accent-text);
    }
    .tree-action.danger:hover:not(:disabled) {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .tree-action svg { width: 0.9rem; height: 0.9rem; }
    .content { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
    .content-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.25rem;
    }
    .table-card {
      overflow: hidden;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }
    .table-scroll { flex: 1; overflow: auto; }
    .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
    }
    .local-inbound-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--label);
    }
    input, select, button, textarea {
      font: inherit;
      border-radius: 0.5rem;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: var(--text);
      padding: 0.5rem 0.75rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #bae6fd;
      outline-offset: 0;
      border-color: #0ea5e9;
    }
    input[type="checkbox"] { width: auto; align-self: start; margin-top: 0.35rem; accent-color: var(--accent); }
    button {
      cursor: pointer;
      background: #ffffff;
      border-color: var(--border-strong);
      color: #475569;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    button:hover:not(:disabled) { background: #f8fafc; color: var(--accent-text); border-color: #94a3b8; }
    button.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
      font-weight: 500;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); color: #ffffff; }
    button.danger {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: var(--danger-border);
    }
    button.danger:hover:not(:disabled) { background: #fee2e2; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead { background: #f1f5f9; color: var(--label); }
    th, td { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    th { font-weight: 600; font-size: 0.8125rem; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.6875rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: #f8fafc;
    }
    .badge.off { opacity: 0.65; color: var(--muted); }
    #toast {
      position: fixed; right: 1rem; bottom: 1rem;
      padding: 0.75rem 1rem; border-radius: 0.5rem;
      background: var(--ok-soft); border: 1px solid var(--ok-border); color: #047857;
      display: none; max-width: 420px; z-index: 30;
      box-shadow: 0 10px 15px rgba(15, 23, 42, 0.08);
      font-size: 0.875rem;
    }
    #toast.error {
      border-color: var(--danger-border);
      color: #b91c1c;
      background: var(--danger-soft);
    }
    dialog {
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--panel);
      color: var(--text);
      width: min(640px, 96vw);
      padding: 0;
      box-shadow: 0 20px 25px rgba(15, 23, 42, 0.12);
    }
    dialog::backdrop { background: rgba(15, 23, 42, 0.4); }
    .dialog-body { padding: 1.25rem; }
    .dialog-head {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dialog-head strong { font-size: 1.125rem; color: var(--text); }
    .dialog-hint { color: var(--muted); margin: 0 0 0.75rem; font-size: 0.875rem; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }
    .hidden { display: none !important; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8125rem; }
    .event-detail { color: var(--muted); font-size: 0.8125rem; max-width: 360px; word-break: break-word; }
    .empty { color: var(--muted); text-align: center; padding: 2rem; font-size: 0.875rem; }
    .pagination {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid #f1f5f9;
      font-size: 0.8125rem;
      color: var(--muted);
      flex-shrink: 0;
      background: var(--panel);
    }
    .pagination button { min-width: 5.5rem; border-radius: 0.5rem; }
    .settings-groups { display: flex; flex-direction: column; gap: 1rem; }
    .settings-group {
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      padding: 1rem 1rem 1.25rem;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .settings-group h3 {
      margin: 0 0 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }
    .route-tabs {
      display: flex;
      gap: 0.25rem;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 1rem;
    }
    .route-tab {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 0;
      margin-bottom: -1px;
    }
    .route-tab:hover:not(:disabled):not(.active) {
      color: var(--accent-text);
    }
    .route-tab.active {
      border-bottom-color: #0ea5e9;
      color: var(--accent-text);
    }
    .route-tab:disabled {
      opacity: 1;
      cursor: default;
    }
    .route-tab:not(.active):disabled {
      opacity: 0.45;
    }
    .route-id-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .route-id-row.lp-kind label:first-child {
      grid-column: 1 / -1;
    }
    .route-id-row.lp-kind #evmConfWrap {
      display: none;
    }
    .route-foreign-wrap {
      display: grid;
      min-height: 8.5rem;
    }
    .route-foreign-wrap > .grid {
      grid-area: 1 / 1;
      margin: 0;
      grid-template-columns: 1fr 1fr;
      row-gap: 0.125rem;
      column-gap: 0.75rem;
    }
    .route-foreign-wrap label {
      gap: 0.125rem;
    }
    .route-foreign-wrap > .grid.hidden {
      display: grid !important;
      visibility: hidden;
      pointer-events: none;
    }
    .route-local-panel {
      margin-top: 1.25rem;
      gap: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1 class="header-title">LightPool Bridge</h1>
    <div class="toolbar">
      <button type="button" id="settingsBtn">Settings</button>
      <button type="button" class="primary" id="addRouteBtn">+ Add route</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <ul class="route-tree" id="routeTree"></ul>
    </aside>

    <section class="content">
      <div class="content-body">
        <div class="table-card">
          <div class="table-scroll">
            <table>
              <tbody id="eventsBody"></tbody>
            </table>
            <div class="empty hidden" id="eventsEmpty">No events yet</div>
          </div>
          <div class="pagination">
            <button type="button" id="eventsPrevBtn" disabled>Previous</button>
            <span id="eventsPageInfo">Page 1 of 1</span>
            <button type="button" id="eventsNextBtn" disabled>Next</button>
            <span id="eventsTotalInfo">0 events</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <dialog id="settingsDialog">
    <div class="dialog-body">
      <div class="grid">
        <label>Local LP RPC <input id="localRpc" placeholder="http://127.0.0.1:26300" /></label>
        <label>Wallet path <input id="walletPath" placeholder="/path/to/wallet.json" /></label>
      </div>
      <div class="dialog-actions">
        <button type="button" id="cancelSettingsBtn">Cancel</button>
        <button type="button" class="primary" id="saveGlobalBtn">Save</button>
      </div>
    </div>
  </dialog>

  <dialog id="routeDialog">
    <div class="dialog-body">
      <div class="route-tabs">
        <button type="button" class="route-tab active" id="routeTabEvm" data-kind="evm">EVM (ERC20)</button>
        <button type="button" class="route-tab" id="routeTabLp" data-kind="lightpool">LightPool</button>
      </div>
      <div class="route-id-row" id="routeIdRow">
        <label>Route ID <input id="routeId" /></label>
        <label id="evmConfWrap">EVM block confirmations <input id="evmConf" type="number" min="1" /></label>
      </div>
      <div class="route-foreign-wrap">
        <div id="evmFields" class="grid">
          <label>EVM RPC <input id="evmRpc" /></label>
          <label>EVM chain ID <input id="evmChainId" type="number" /></label>
          <label>EVM bridge contract <input id="evmBridge" /></label>
          <label>EVM token address <input id="evmToken" /></label>
        </div>
        <div id="lpFields" class="grid hidden">
          <label>Foreign LP RPC <input id="lpRpc" /></label>
          <label>Foreign chain ID <input id="lpChainId" type="number" /></label>
          <label>Foreign bridge contract <input id="lpOutbound" /></label>
          <label>Foreign token <input id="lpForeignToken" /></label>
        </div>
      </div>
      <div id="localFields" class="grid route-local-panel">
        <label>Local bridge contract <input id="localBridgeContract" placeholder="0x0600000000000001" /></label>
        <label>Local LP token <input id="localLpToken" placeholder="0x0200000000000001" /></label>
      </div>
      <div class="dialog-actions">
        <button type="button" id="cancelRouteBtn">Cancel</button>
        <button type="button" class="primary" id="saveRouteBtn">Save route</button>
      </div>
    </div>
  </dialog>

  <div id="toast"></div>

  <script>
    let config = null;
    let status = null;
    let selectedRouteId = "";
    let editingRouteId = null;
    let creating = false;
    let eventsLive = [];
    let eventsWs = null;
    let eventsWsGeneration = 0;
    let eventsPage = 1;
    let eventsTotalPages = 0;
    let eventsTotal = 0;
    const PAGE_SIZE = 50;

    const $ = (id) => document.getElementById(id);

    function toast(msg, isError = false) {
      const el = $("toast");
      el.textContent = msg;
      el.className = isError ? "error" : "";
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 3500);
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      if (res.status === 204) return null;
      const text = await res.text();
      const data = text ? JSON.parse(text) : null;
      if (!res.ok) throw new Error(data?.error || res.statusText);
      return data;
    }

    function validatorLabel() {
      if (!status?.validator) return "—";
      return status.validator.length > 18
        ? status.validator.slice(0, 16) + "…"
        : status.validator;
    }

    function ensureSelectedRoute() {
      const routes = config?.routes || [];
      if (selectedRouteId && routes.some((r) => r.id === selectedRouteId)) return;
      selectedRouteId = "";
    }

    function selectRoute(id) {
      selectedRouteId = id;
      eventsPage = 1;
      renderTree();
      loadEventsPage(1)
        .then(() => connectEventsWs())
        .catch((e) => toast(e.message, true));
    }

    function selectAllEvents() {
      selectRoute("");
    }

    function eventsQueryParams(page) {
      const params = new URLSearchParams();
      if (selectedRouteId) params.set("route_id", selectedRouteId);
      params.set("page", String(page));
      params.set("page_size", String(PAGE_SIZE));
      return params;
    }

    async function loadEventsPage(page) {
      const data = await api(`/api/events?${eventsQueryParams(page)}`);
      eventsPage = data.page || page;
      eventsTotalPages = data.total_pages || 0;
      eventsTotal = data.total || 0;
      eventsLive = data.events || [];
      renderEvents(eventsLive);
      updatePagination();
    }

    function updatePagination() {
      const atFirst = eventsPage <= 1;
      const atLast = eventsTotalPages === 0 || eventsPage >= eventsTotalPages;
      $("eventsPrevBtn").disabled = atFirst;
      $("eventsNextBtn").disabled = atLast;
      const pageLabel = eventsTotalPages > 0
        ? `Page ${eventsPage} of ${eventsTotalPages}`
        : "Page 1 of 1";
      $("eventsPageInfo").textContent = pageLabel;
      $("eventsTotalInfo").textContent = `${eventsTotal.toLocaleString()} events`;
    }

    function wsUrl() {
      const params = new URLSearchParams();
      if (selectedRouteId) params.set("route_id", selectedRouteId);
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/api/ws/events?${params}`;
    }

    function connectEventsWs() {
      eventsWsGeneration += 1;
      const generation = eventsWsGeneration;
      if (eventsWs) {
        eventsWs.close();
        eventsWs = null;
      }
      eventsLive = [];
      renderEvents(eventsLive);
      updatePagination();

      const ws = new WebSocket(wsUrl());
      eventsWs = ws;

      ws.onmessage = (msg) => {
        if (generation !== eventsWsGeneration) return;
        let payload;
        try {
          payload = JSON.parse(msg.data);
        } catch (_) {
          return;
        }
        if (payload.type === "status") {
          status = payload.status;
          renderTree();
          return;
        }
        if (payload.type === "event" && payload.event) {
          if (eventsPage === 1) {
            eventsLive = [payload.event, ...eventsLive.filter((e) => e.id !== payload.event.id)];
            if (eventsLive.length > PAGE_SIZE) {
              eventsLive.length = PAGE_SIZE;
            }
            eventsTotal += 1;
            eventsTotalPages = Math.max(
              eventsTotalPages,
              Math.ceil(eventsTotal / PAGE_SIZE) || 0,
            );
            renderEvents(eventsLive);
            updatePagination();
          }
          if (payload.event.kind === "config_updated" || payload.event.kind === "route_reloaded") {
            loadConfig().catch(() => {});
          }
        }
      };

      ws.onclose = () => {
        if (generation !== eventsWsGeneration) return;
        setTimeout(() => {
          if (generation === eventsWsGeneration) connectEventsWs();
        }, 1500);
      };
    }

    const ICON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`;
    const ICON_REMOVE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`;

    function renderTree() {
      const tree = $("routeTree");
      tree.innerHTML = "";

      const root = document.createElement("li");
      root.className = "tree-item root mono" + (selectedRouteId === "" ? " active" : "");
      root.innerHTML = `<span class="icon">▸</span><span class="label">${validatorLabel()}</span>`;
      root.addEventListener("click", () => selectAllEvents());
      tree.appendChild(root);

      for (const route of config?.routes || []) {
        const li = document.createElement("li");
        li.className = "tree-item child" + (selectedRouteId === route.id ? " active" : "");
        const off = route.enabled ? "" : ' <span class="badge off">off</span>';
        li.innerHTML = `
          <span class="icon">•</span>
          <span class="label"><code>${route.id}</code>${off}</span>
          <span class="tree-actions">
            <button type="button" class="tree-action" title="Edit route" aria-label="Edit route">${ICON_EDIT}</button>
            <button type="button" class="tree-action danger" title="Remove route" aria-label="Remove route">${ICON_REMOVE}</button>
          </span>
        `;
        li.addEventListener("click", () => selectRoute(route.id));
        const [editBtn, removeBtn] = li.querySelectorAll(".tree-action");
        editBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openRouteDialog(route.id);
        });
        removeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          removeRoute(route.id).catch((err) => toast(err.message, true));
        });
        tree.appendChild(li);
      }
    }

    function routeMeta(routeId) {
      const route = config?.routes?.find((r) => r.id === routeId);
      const rs = status?.routes?.find((r) => r.id === routeId);
      return { route, rs };
    }

    function isEvmTokenEvent(kind) {
      return [
        "deposit_seen",
        "evm_request_sent",
        "evm_request_failed",
        "evm_finalized",
        "evm_finalize_failed",
      ].includes(kind);
    }

    function formatTokenCell(e) {
      if (!e.route_id || e.route_id === "global") return "—";
      const { route, rs } = routeMeta(e.route_id);
      const symbol = "USDT";
      if (isEvmTokenEvent(e.kind) && route?.foreign?.kind === "evm") {
        const addr =
          route.foreign.token_address || rs?.evm_token_on_chain || e.token || "—";
        return `${symbol}(${addr})`;
      }
      const lp = rs?.lp_token_on_chain || route?.local_inbound?.lp_token || e.token || "—";
      return `${symbol}(${lp})`;
    }

    function formatAmountCell(e) {
      if (e.amount == null) return "—";
      const value = Number(e.amount) / 1_000_000;
      return value.toLocaleString("en-US", {
        minimumFractionDigits: 4,
        maximumFractionDigits: 4,
      });
    }

    function renderEvents(events) {
      const showAllRoutes = selectedRouteId === "";
      const body = $("eventsBody");
      body.innerHTML = "";
      $("eventsEmpty").classList.toggle("hidden", events.length > 0);
      for (const e of events) {
        const tr = document.createElement("tr");
        const ts = new Date(Number(e.ts_ms)).toISOString();
        const routeCell = showAllRoutes
          ? `<td class="mono">${e.route_id || "global"}</td>`
          : "";
        tr.innerHTML = `
          <td class="mono">${ts}</td>
          ${routeCell}
          <td class="mono">${formatTokenCell(e)}</td>
          <td>${e.kind}</td>
          <td class="mono">${formatAmountCell(e)}</td>
          <td class="event-detail">${e.detail}</td>
        `;
        body.appendChild(tr);
      }
      body.closest(".table-scroll")?.scrollTo(0, 0);
    }

    function fillGlobal() {
      $("localRpc").value = config.local?.rpc_url || config.lightpool_rpc_url || "";
      $("walletPath").value = config.wallet_path || "";
    }

    function getRouteKind() {
      return $("routeTabEvm").classList.contains("active") ? "evm" : "lightpool";
    }

    function setRouteKind(kind, { updateId = false } = {}) {
      $("routeTabEvm").classList.toggle("active", kind === "evm");
      $("routeTabLp").classList.toggle("active", kind === "lightpool");
      if (updateId && creating) {
        $("routeId").value = defaultRouteId(kind === "evm" ? "evm" : "lp");
      }
      toggleKindFields(kind);
      updateRouteTabsState();
    }

    function updateRouteTabsState() {
      const locked = !creating;
      $("routeTabEvm").disabled = locked;
      $("routeTabLp").disabled = locked;
    }

    function toggleKindFields(kind = getRouteKind()) {
      $("evmFields").classList.toggle("hidden", kind !== "evm");
      $("lpFields").classList.toggle("hidden", kind !== "lightpool");
      $("routeIdRow").classList.toggle("lp-kind", kind === "lightpool");
    }

    function defaultRouteId(prefix) {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
      let id = `${prefix}-${stamp}`;
      let n = 2;
      while (config?.routes?.some((r) => r.id === id)) {
        id = `${prefix}-${stamp}-${n}`;
        n += 1;
      }
      return id;
    }

    function openRouteDialog(routeId = null) {
      creating = !routeId || !config.routes.some((r) => r.id === routeId);
      editingRouteId = creating ? null : routeId;
      $("routeId").disabled = !creating;

      if (creating) {
        const kind = routeId?.startsWith("lp-") ? "lightpool" : "evm";
        $("routeId").value = routeId || defaultRouteId(kind === "evm" ? "evm" : "lp");
        setRouteKind(kind);
        $("localBridgeContract").value = "";
        $("localLpToken").value = "";
        $("evmRpc").value = "";
        $("evmChainId").value = "";
        $("evmBridge").value = "";
        $("evmToken").value = "";
        $("evmConf").value = 1;
        $("lpRpc").value = "";
        $("lpChainId").value = "";
        $("lpOutbound").value = "";
        $("lpForeignToken").value = "";
      } else {
        const route = config.routes.find((r) => r.id === routeId);
        if (!route) return;
        $("routeId").value = route.id;
        setRouteKind(route.foreign.kind);
        $("localBridgeContract").value = route.local_inbound.bridge_contract || "";
        $("localLpToken").value = route.local_inbound.lp_token || "";
        if (route.foreign.kind === "evm") {
          $("evmRpc").value = route.foreign.rpc_url;
          $("evmChainId").value = route.foreign.chain_id;
          $("evmBridge").value = route.foreign.bridge_address;
          $("evmToken").value = route.foreign.token_address;
          $("evmConf").value = route.foreign.confirmations;
        } else {
          $("lpRpc").value = route.foreign.rpc_url;
          $("lpChainId").value = route.foreign.chain_id;
          $("lpOutbound").value = route.foreign.outbound_bridge_contract;
          $("lpForeignToken").value = route.foreign.foreign_token;
        }
      }
      $("routeDialog").showModal();
    }

    function buildRouteFromForm() {
      const kind = getRouteKind();
      const local_inbound = {
        bridge_contract: $("localBridgeContract").value.trim(),
        lp_token: $("localLpToken").value.trim(),
      };
      let foreign;
      if (kind === "evm") {
        foreign = {
          kind: "evm",
          rpc_url: $("evmRpc").value.trim(),
          chain_id: Number($("evmChainId").value),
          bridge_address: $("evmBridge").value.trim(),
          token_address: $("evmToken").value.trim(),
          confirmations: Number($("evmConf").value),
          start_block: 0,
        };
      } else {
        foreign = {
          kind: "lightpool",
          rpc_url: $("lpRpc").value.trim(),
          chain_id: Number($("lpChainId").value),
          outbound_bridge_contract: $("lpOutbound").value.trim(),
          foreign_token: $("lpForeignToken").value.trim(),
        };
      }
      return {
        id: $("routeId").value.trim(),
        enabled: editingRouteId
          ? (config.routes.find((r) => r.id === editingRouteId)?.enabled ?? true)
          : true,
        local_inbound,
        foreign,
      };
    }

    function applyGlobalToConfig() {
      config.wallet_path = $("walletPath").value.trim();
      config.local = config.local || {};
      config.local.rpc_url = $("localRpc").value.trim();
      config.lightpool_rpc_url = config.local.rpc_url;
    }

    async function loadConfig() {
      config = await api("/api/config");
      fillGlobal();
      ensureSelectedRoute();
      renderTree();
    }

    async function loadAll() {
      await api("/api/health");
      await loadConfig();
      await loadEventsPage(eventsPage);
      connectEventsWs();
    }

    async function saveGlobal() {
      applyGlobalToConfig();
      config = await api("/api/config", { method: "PUT", body: JSON.stringify({ config }) });
      toast("Settings saved");
      $("settingsDialog").close();
      await loadConfig();
      connectEventsWs();
    }

    async function saveRoute() {
      const route = buildRouteFromForm();
      if (!route.id) throw new Error("route id required");
      if (creating) {
        await api("/api/routes", { method: "POST", body: JSON.stringify(route) });
      } else {
        await api(`/api/routes/${encodeURIComponent(route.id)}`, {
          method: "PUT",
          body: JSON.stringify(route),
        });
      }
      $("routeDialog").close();
      selectedRouteId = route.id;
      await loadAll();
      toast(creating ? "Route added and loaded" : "Route updated");
    }

    async function removeRoute(routeId) {
      if (!routeId) return;
      if (!confirm(`Remove route "${routeId}"?`)) return;
      await api(`/api/routes/${encodeURIComponent(routeId)}`, { method: "DELETE" });
      if (selectedRouteId === routeId) selectedRouteId = "";
      await loadAll();
      toast("Route removed");
    }

    $("routeTabEvm").addEventListener("click", () => {
      if (!creating) return;
      setRouteKind("evm", { updateId: true });
    });
    $("routeTabLp").addEventListener("click", () => {
      if (!creating) return;
      setRouteKind("lightpool", { updateId: true });
    });
    $("settingsBtn").addEventListener("click", () => { fillGlobal(); $("settingsDialog").showModal(); });
    $("saveGlobalBtn").addEventListener("click", () => saveGlobal().catch((e) => toast(e.message, true)));
    $("cancelSettingsBtn").addEventListener("click", () => $("settingsDialog").close());
    $("addRouteBtn").addEventListener("click", () => openRouteDialog(defaultRouteId("evm")));
    $("saveRouteBtn").addEventListener("click", () => saveRoute().catch((e) => toast(e.message, true)));
    $("cancelRouteBtn").addEventListener("click", () => $("routeDialog").close());

    $("eventsPrevBtn").addEventListener("click", () => {
      if (eventsPage <= 1) return;
      loadEventsPage(eventsPage - 1).catch((e) => toast(e.message, true));
    });
    $("eventsNextBtn").addEventListener("click", () => {
      if (eventsPage >= eventsTotalPages) return;
      loadEventsPage(eventsPage + 1).catch((e) => toast(e.message, true));
    });

    loadAll().catch((e) => toast(e.message, true));
  </script>
</body>
</html>
